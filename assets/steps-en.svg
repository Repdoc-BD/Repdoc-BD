<svg xmlns="http://www.w3.org/2000/svg" width="800" height="150" viewBox="0 0 800 150"><style>
text{font-family:'Noto Sans Bengali','Hind Siliguri','Nirmala UI','Kohinoor Bangla','Bangla Sangam MN','Segoe UI','Helvetica Neue',Arial,sans-serif}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes cyc{0%{opacity:0;transform:translateY(10px)}8%{opacity:1;transform:none}44%{opacity:1}52%{opacity:0}100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.up{animation:up .8s ease both}
.fl{animation:fl 6s ease-in-out infinite}
.cy{opacity:0;animation:cyc 10s infinite backwards}
.pu{animation:pulse 2.4s ease-in-out infinite}
</style><defs><linearGradient id="c" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient></defs><g class="up" style="animation-delay:0.0s"><rect x="0" y="0" width="250" height="150" rx="16" fill="url(#c)" stroke="#38bdf8" stroke-opacity=".45"/><circle cx="38" cy="40" r="20" fill="#38bdf8"/><text x="38" y="47" text-anchor="middle" font-size="20" font-weight="800" fill="#0b1220">1</text><text x="68" y="47" font-size="20" font-weight="700" fill="#fff">Choose a tool</text><text x="24" y="92" font-size="15" fill="#cbd5e1">Open the tool or template</text><text x="24" y="116" font-size="15" fill="#cbd5e1">you need</text></g><path class="pu" d="M255 65 l8 10 l-8 10" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g class="up" style="animation-delay:0.2s"><rect x="275" y="0" width="250" height="150" rx="16" fill="url(#c)" stroke="#38bdf8" stroke-opacity=".45"/><circle cx="313" cy="40" r="20" fill="#38bdf8"/><text x="313" y="47" text-anchor="middle" font-size="20" font-weight="800" fill="#0b1220">2</text><text x="343" y="47" font-size="20" font-weight="700" fill="#fff">Enter details</text><text x="299" y="92" font-size="15" fill="#cbd5e1">Fill in the form and check</text><text x="299" y="116" font-size="15" fill="#cbd5e1">the live preview</text></g><path class="pu" d="M530 65 l8 10 l-8 10" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g class="up" style="animation-delay:0.4s"><rect x="550" y="0" width="250" height="150" rx="16" fill="url(#c)" stroke="#38bdf8" stroke-opacity=".45"/><circle cx="588" cy="40" r="20" fill="#38bdf8"/><text x="588" y="47" text-anchor="middle" font-size="20" font-weight="800" fill="#0b1220">3</text><text x="618" y="47" font-size="20" font-weight="700" fill="#fff">Download</text><text x="574" y="92" font-size="15" fill="#cbd5e1">Get Word and PDF files,</text><text x="574" y="116" font-size="15" fill="#cbd5e1">then print and deliver</text></g></svg>